# DevOps Tmux Configuration
# Terminal multiplexer for efficient DevOps workflows

# =============================================================================
# BASIC SETTINGS
# =============================================================================

# Set prefix key to Ctrl-a (easier than default Ctrl-b)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Enable mouse support
set -g mouse on

# Set default terminal
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Increase scrollback buffer
set -g history-limit 10000

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when a window is closed
set -g renumber-windows on

# =============================================================================
# KEY BINDINGS
# =============================================================================

# Reload config file
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize panes using Ctrl-arrow
bind -n C-Left resize-pane -L 5
bind -n C-Right resize-pane -R 5
bind -n C-Up resize-pane -U 5
bind -n C-Down resize-pane -D 5

# Switch windows using Alt-number
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Create new window with current path
bind c new-window -c "#{pane_current_path}"

# =============================================================================
# STATUS BAR
# =============================================================================

# Status bar colors
set -g status-bg colour235
set -g status-fg colour136
set -g status-style default

# Status bar left side
set -g status-left-length 40
set -g status-left "#[fg=green]#S #[fg=blue]#I #[fg=blue]#P "

# Status bar right side
set -g status-right-length 60
set -g status-right "#[fg=blue]%Y-%m-%d %H:%M #[fg=green]#(whoami)@#h"

# Window status
setw -g window-status-current-style "fg=white,bg=red"
setw -g window-status-style "fg=blue,bg=default"

# =============================================================================
# PANE BORDERS
# =============================================================================

set -g pane-border-style "fg=colour235"
set -g pane-active-border-style "fg=colour240"

# =============================================================================
# COPY MODE
# =============================================================================

# Use vi keybindings in copy mode
setw -g mode-keys vi

# Copy mode key bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi r send -X rectangle-toggle

# =============================================================================
# DEVOPS-SPECIFIC SETTINGS
# =============================================================================

# Set default shell
set -g default-command "bash"

# Allow programs to change window title
set -g allow-rename on

